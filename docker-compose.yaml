services:

  db:
    container_name: plants-api-db
    image: postgres:17
    env_file:
      - .env
    volumes:
      - plants-api-db-volume:/var/lib/postgresql
    networks:
      - backend-to-db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    container_name: plants-api-backend
    build: .
    image: nnimens/plants-api:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/postgres
    env_file:
      - .env
    networks:
      - backend-to-db
      - nginx-to-backend
    depends_on:
      db:
        condition: service_healthy

  nginx:
    container_name: plants-api-nginx
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - nginx-to-backend
    depends_on:
      - backend

volumes:
  plants-api-db-volume:

networks:
  backend-to-db:
    driver: bridge
  nginx-to-backend:
    driver: bridge