services:

  db:
    container_name: plants-api-db
    image: postgres:17
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - plants-api-db-volume:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    container_name: plants-api-backend
    build: .
    image: nnimens/plants-api:latest
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - db

  nginx:
    container_name: plants-api-nginx
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  plants-api-db-volume: